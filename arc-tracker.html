<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arc Raiders – Loot Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 1.5rem;
      background: #0b1020;
      color: #f5f5f5;
    }
    .app-shell {
      max-width: 900px;
      margin: 0 auto;
      background: #151b30;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h1 { margin-top: 0; }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .form-row > div {
      flex: 1;
      min-width: 140px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-bottom: 0.25rem;
    }
    input[type="text"],
    input[type="number"],
    input[type="email"],
    select,
    textarea {
      padding: 0.4rem 0.5rem;
      border-radius: 6px;
      border: 1px solid #303854;
      background: #0f1424;
      color: #f5f5f5;
    }
    textarea {
      min-height: 50px;
      resize: vertical;
    }
    button {
      border: none;
      border-radius: 6px;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-primary { background: #4f8cff; color: #fff; }
    .btn-secondary { background: #303854; color: #fff; }
    .btn-small { padding: 0.25rem 0.5rem; font-size: 0.75rem; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 0.75rem 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    th, td {
      padding: 0.5rem;
      border-bottom: 1px solid #262c46;
      text-align: left;
    }
    th { background: #1b2238; }
    tr.done { opacity: 0.5; }

    .priority-pill {
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .priority-high { background: #ff4f6a; }
    .priority-medium { background: #ffb74f; color: #201010; }
    .priority-low { background: #66c56b; color: #041407; }

    .status-badge {
      font-size: 0.75rem;
      padding: 0.1rem 0.4rem;
      border-radius: 999px;
    }
    .status-active { background: #ffb74f; color: #201010; }
    .status-done { background: #66c56b; color: #041407; }

    .empty-state {
      text-align: center;
      padding: 1rem;
      opacity: 0.7;
    }

    .auth-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      padding: 0.5rem;
      margin-bottom: 1rem;
      background: #0f1424;
      border-radius: 8px;
      border: 1px solid #303854;
      font-size: 0.85rem;
    }
    .auth-status {
      flex: 1;
      min-width: 180px;
      opacity: 0.9;
    }
    .auth-buttons {
      display: flex;
      gap: 0.25rem;
      flex-wrap: wrap;
    }
    .auth-buttons input[type="email"] {
      max-width: 200px;
    }
    .auth-warning {
      font-size: 0.75rem;
      opacity: 0.7;
      width: 100%;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <h1>Arc Raiders – Loot Tracker</h1>
    <p style="opacity:0.8;font-size:0.9rem;">
      Track the materials you’re farming. Log in with a magic link to keep a per-user profile (still stored locally for now).
    </p>

    <!-- AUTH BAR: email-link login (passwordless) -->
    <div class="auth-bar">
      <div class="auth-status" id="authStatus">
        Not logged in (using <strong>Guest</strong> data).
      </div>
      <div class="auth-buttons">
        <input id="authEmail" type="email" placeholder="email@example.com">
        <button class="btn-secondary btn-small" id="sendLinkBtn">Send login link</button>
        <button class="btn-secondary btn-small" id="logoutBtn" style="display:none;">Log Out</button>
      </div>
      <div class="auth-warning" id="authWarning">
        You’ll get a magic link by email. Data is per-user in this browser only. Cloud sync comes later.
      </div>
    </div>

    <!-- FORM -->
    <div id="form">
      <div class="form-row">
        <div>
          <label for="itemName">Item name</label>
          <input id="itemName" type="text" placeholder="Flux Capacitor">
        </div>
        <div>
          <label for="itemCategory">Category</label>
          <input id="itemCategory" type="text" placeholder="Crafting, Weapon Mod…">
        </div>
        <div>
          <label for="itemPriority">Priority</label>
          <select id="itemPriority">
            <option value="3">High</option>
            <option value="2">Medium</option>
            <option value="1">Low</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div>
          <label for="itemNeeded">Needed</label>
          <input id="itemNeeded" type="number" min="1" value="1">
        </div>
        <div>
          <label for="itemHave">Have</label>
          <input id="itemHave" type="number" min="0" value="0">
        </div>
      </div>

      <div class="form-row">
        <div>
          <label for="itemNotes">Notes</label>
          <textarea id="itemNotes" placeholder="e.g. Drops in canyon raid at night."></textarea>
        </div>
      </div>

      <button class="btn-primary" id="addItemBtn">Add / Update Item</button>
      <button class="btn-secondary" id="clearFormBtn">Clear Form</button>
      <input type="hidden" id="editingId" value="">
    </div>

    <!-- FILTERS -->
    <div class="toolbar">
      <div>
        <strong>Filter:</strong>
        <select id="filterStatus">
          <option value="all">All items</option>
          <option value="active">Only farming</option>
          <option value="done">Completed</option>
        </select>
      </div>
      <div>
        <strong>Sort:</strong>
        <select id="sortMode">
          <option value="priority">Priority & Remaining</option>
          <option value="name">Name (A–Z)</option>
        </select>
      </div>
    </div>

    <!-- ITEMS TABLE -->
    <div id="itemsContainer"></div>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

      storageBucket: "arc-raiders-tracker.firebasestorage.app",

    };

    let auth = null;
    let currentUser = null;

    const authStatusEl = document.getElementById("authStatus");
    const authWarningEl = document.getElementById("authWarning");
    const emailInput   = document.getElementById("authEmail");
    const sendLinkBtn  = document.getElementById("sendLinkBtn");
    const logoutBtn    = document.getElementById("logoutBtn");

    // ============================
    // 2. AUTH UI HELPERS
    // ============================

    function updateAuthUI() {
      if (!auth) return; 

      if (currentUser) {
        authStatusEl.innerHTML = `Logged in as <strong>${currentUser.email}</strong>.`;
        sendLinkBtn.style.display = "none";
        emailInput.style.display = "none";

      } else {
