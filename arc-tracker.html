
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arc Raiders – Loot Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 1.5rem;
      background: #0b1020;
      color: #f5f5f5;
    }
    .app-shell {
      max-width: 900px;
      margin: 0 auto;
      background: #151b30;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h1 { margin-top: 0; }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .form-row > div {
      flex: 1;
      min-width: 140px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-bottom: 0.25rem;
    }
    input[type="text"],
    input[type="number"],
    input[type="email"],
    select,
    textarea {
      padding: 0.4rem 0.5rem;
      border-radius: 6px;
      border: 1px solid #303854;
      background: #0f1424;
      color: #f5f5f5;
    }
    textarea {
      min-height: 50px;
      resize: vertical;
    }
    button {
      border: none;
      border-radius: 6px;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-primary { background: #4f8cff; color: #fff; }
    .btn-secondary { background: #303854; color: #fff; }
    .btn-small { padding: 0.25rem 0.5rem; font-size: 0.75rem; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 0.75rem 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    th, td {
      padding: 0.5rem;
      border-bottom: 1px solid #262c46;
      text-align: left;
    }
    th { background: #1b2238; }
    tr.done { opacity: 0.5; }

    .priority-pill {
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .priority-high { background: #ff4f6a; }
    .priority-medium { background: #ffb74f; color: #201010; }
    .priority-low { background: #66c56b; color: #041407; }

    .status-badge {
      font-size: 0.75rem;
      padding: 0.1rem 0.4rem;
      border-radius: 999px;
    }
    .status-active { background: #ffb74f; color: #201010; }
    .status-done { background: #66c56b; color: #041407; }

    .empty-state {
      text-align: center;
      padding: 1rem;
      opacity: 0.7;
    }

    .auth-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      padding: 0.5rem;
      margin-bottom: 1rem;
      background: #0f1424;
      border-radius: 8px;
      border: 1px solid #303854;
      font-size: 0.85rem;
    }
    .auth-status {
      flex: 1;
      min-width: 180px;
      opacity: 0.9;
    }
    .auth-buttons {
      display: flex;
      gap: 0.25rem;
      flex-wrap: wrap;
    }
    .auth-buttons input[type="email"] {
      max-width: 200px;
    }
    .auth-warning {
      font-size: 0.75rem;
      opacity: 0.7;
      width: 100%;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <h1>Arc Raiders – Loot Tracker</h1>
    <p style="opacity:0.8;font-size:0.9rem;">
      Track the materials you’re farming. Log in with a magic link to keep a per-user profile (still stored locally for now).
    </p>

    <!-- AUTH BAR: email-link login (passwordless) -->
    <div class="auth-bar">
      <div class="auth-status" id="authStatus">
        Not logged in (using <strong>Guest</strong> data).
      </div>
      <div class="auth-buttons">
        <input id="authEmail" type="email" placeholder="email@example.com">
        <button class="btn-secondary btn-small" id="sendLinkBtn">Send login link</button>
        <button class="btn-secondary btn-small" id="logoutBtn" style="display:none;">Log Out</button>
      </div>
      <div class="auth-warning" id="authWarning">
        You’ll get a magic link by email. Data is per-user in this browser only. Cloud sync comes later.
      </div>
    </div>

    <!-- FORM -->
    <div id="form">
      <div class="form-row">
        <div>
          <label for="itemName">Item name</label>
          <input id="itemName" type="text" placeholder="Flux Capacitor">
        </div>
        <div>
          <label for="itemCategory">Category</label>
          <input id="itemCategory" type="text" placeholder="Crafting, Weapon Mod…">
        </div>
        <div>
          <label for="itemPriority">Priority</label>
          <select id="itemPriority">
            <option value="3">High</option>
            <option value="2">Medium</option>
            <option value="1">Low</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div>
          <label for="itemNeeded">Needed</label>
          <input id="itemNeeded" type="number" min="1" value="1">
        </div>
        <div>
          <label for="itemHave">Have</label>
          <input id="itemHave" type="number" min="0" value="0">
        </div>
      </div>

      <div class="form-row">
        <div>
          <label for="itemNotes">Notes</label>
          <textarea id="itemNotes" placeholder="e.g. Drops in canyon raid at night."></textarea>
        </div>
      </div>

      <button class="btn-primary" id="addItemBtn">Add / Update Item</button>
      <button class="btn-secondary" id="clearFormBtn">Clear Form</button>
      <input type="hidden" id="editingId" value="">
    </div>

    <!-- FILTERS -->
    <div class="toolbar">
      <div>
        <strong>Filter:</strong>
        <select id="filterStatus">
          <option value="all">All items</option>
          <option value="active">Only farming</option>
          <option value="done">Completed</option>
        </select>
      </div>
      <div>
        <strong>Sort:</strong>
        <select id="sortMode">
          <option value="priority">Priority & Remaining</option>
          <option value="name">Name (A–Z)</option>
        </select>
      </div>
    </div>

    <!-- ITEMS TABLE -->
    <div id="itemsContainer"></div>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <script>
    // ============================
    // 1. FIREBASE CONFIG + GLOBALS
    // ============================

    // TODO: Paste your real firebaseConfig for project "ar-raiders-tracker" here:
    // (from Project Settings → General → Your apps → Web app)
    const firebaseConfig = {
      // apiKey: "AIzaSy.......",
      // authDomain: "ar-raiders-tracker.firebaseapp.com",
      // projectId: "ar-raiders-tracker",
      // storageBucket: "ar-raiders-tracker.appspot.com",
      // messagingSenderId: "1234567890",
      // appId: "1:1234567890:web:abcdef123456",
    };

    let auth = null;
    let currentUser = null;

    // DOM elements for auth UI
    const authStatusEl = document.getElementById("authStatus");
    const authWarningEl = document.getElementById("authWarning");
    const emailInput   = document.getElementById("authEmail");
    const sendLinkBtn  = document.getElementById("sendLinkBtn");
    const logoutBtn    = document.getElementById("logoutBtn");

    // ============================
    // 2. AUTH UI HELPERS
    // ============================

    function updateAuthUI() {
      if (!auth) {
        authStatusEl.innerHTML =
          "Firebase not configured – using <strong>Guest</strong> data only.";
        if (sendLinkBtn) sendLinkBtn.disabled = true;
        if (logoutBtn) logoutBtn.style.display = "none";
        if (emailInput) emailInput.disabled = true;
        authWarningEl.textContent =
          "Add your Firebase config in the HTML to enable magic-link login.";
        return;
      }

      if (currentUser) {
        authStatusEl.innerHTML =
          `Logged in as <strong>${currentUser.email}</strong>.`;
        if (logoutBtn) logoutBtn.style.display = "inline-block";
        if (sendLinkBtn) sendLinkBtn.style.display = "none";
        if (emailInput) emailInput.style.display = "none";
        authWarningEl.textContent =
          "Your data is stored per-user in this browser's localStorage (cloud sync later).";
      } else {
        authStatusEl.innerHTML =
          "Not logged in (using <strong>Guest</strong> data).";
        if (logoutBtn) logoutBtn.style.display = "none";
        if (sendLinkBtn) {
          sendLinkBtn.style.display = "inline-block";
          sendLinkBtn.disabled = !auth;
        }
        if (emailInput) {
          emailInput.style.display = "inline-block";
          emailInput.disabled = !auth;
        }
        authWarningEl.textContent =
          "Enter your email and tap 'Send login link'. When you click the link in your email, you'll be signed in.";
      }
    }

    // ============================
    // 3. INIT AUTH + STATE LISTENER
    // ============================

    function initAuth() {
      if (firebaseConfig && firebaseConfig.apiKey) {
        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();

        auth.onAuthStateChanged((user) => {
          currentUser = user || null;
          updateAuthUI();
          renderItems();
        });
      } else {
        // No Firebase config → guest mode only
        auth = null;
        currentUser = null;
        updateAuthUI();
      }
    }

    // Send magic link
    if (sendLinkBtn) {
      sendLinkBtn.addEventListener("click", async () => {
        if (!auth) return;
        const email = (emailInput.value || "").trim();
        if (!email) {
          alert("Enter an email address first.");
          return;
        }

        const actionCodeSettings = {
          // Must be your deployed URL, and be in Authorized Domains
          url: "https://secret-p.github.io/Arc-Raiders-Tracker/",
          handleCodeInApp: true,
        };

        try {
          await auth.sendSignInLinkToEmail(email, actionCodeSettings);
          window.localStorage.setItem("arc_magic_email_for_signin", email);
          alert("Magic link sent! Check your email.");
        } catch (e) {
          console.error("Error sending magic link", e);
          alert("Could not send magic link: " + e.message);
        }
      });
    }

    // Logout
    if (logoutBtn) {
      logoutBtn.addEventListener("click", async () => {
        if (!auth) return;
        try {
          await auth.signOut();
        } catch (e) {
          console.error("Logout failed", e);
          alert("Logout failed: " + e.message);
        }
      });
    }

    // Complete sign-in if we arrived via magic link
    async function handleEmailLinkSignIn() {
      if (!auth) return;
      try {
        if (auth.isSignInWithEmailLink(window.location.href)) {
          let email = window.localStorage.getItem("arc_magic_email_for_signin");
          if (!email) {
            email = window.prompt(
              "Please confirm your email address to complete sign-in:"
            );
          }
          if (!email) return;

          await auth.signInWithEmailLink(email, window.location.href);
          window.localStorage.removeItem("arc_magic_email_for_signin");
          // onAuthStateChanged will fire next
        }
      } catch (e) {
        console.error("Error completing email link sign-in", e);
        alert("Sign-in with link failed: " + e.message);
      }
    }

    // ============================
    // 4. LOCAL STORAGE HELPERS
    // ============================

    function getStorageKey() {
      if (currentUser && currentUser.uid) {
        return "arc_raiders_loot_v1_" + currentUser.uid;
      }
      return "arc_raiders_loot_v1_guest";
    }

    function loadItems() {
      try {
        const raw = localStorage.getItem(getStorageKey());
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        console.error("Failed to load items:", e);
        return [];
      }
    }

    function saveItems(items) {
      try {
        localStorage.setItem(getStorageKey(), JSON.stringify(items));
      } catch (e) {
        console.error("Failed to save items:", e);
      }
    }

    function getPriorityLabel(p) {
      if (p === 3) return "High";
      if (p === 2) return "Medium";
      return "Low";
    }

    function uuid() {
      return "id-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    // ============================
    // 5. ITEM CRUD + RENDERING
    // ============================

    function addOrUpdateItem() {
      const name = document.getElementById("itemName").value.trim();
      if (!name) return;

      const category = document.getElementById("itemCategory").value.trim();
      const priority = parseInt(document.getElementById("itemPriority").value, 10) || 1;
      const needed = Math.max(parseInt(document.getElementById("itemNeeded").value, 10) || 1, 1);
      const have = Math.max(parseInt(document.getElementById("itemHave").value, 10) || 0, 0);
      const notes = document.getElementById("itemNotes").value.trim();
      const editingId = document.getElementById("editingId").value;

      let items = loadItems();

      if (editingId) {
        items = items.map(i =>
          i.id === editingId
            ? { ...i, name, category, priority, needed, have, notes }
            : i
        );
      } else {
        const existing = items.find(
          i => i.name.toLowerCase() === name.toLowerCase()
        );
        if (existing) {
          items = items.map(i =>
            i.id === existing.id
              ? { ...i, category, priority, needed, have, notes }
              : i
          );
        } else {
          items.push({
            id: uuid(),
            name,
            category,
            priority,
            needed,
            have,
            notes
          });
        }
      }

      saveItems(items);
      clearForm();
      renderItems();
    }

    function clearForm() {
      document.getElementById("itemName").value = "";
      document.getElementById("itemCategory").value = "";
      document.getElementById("itemPriority").value = "3";
      document.getElementById("itemNeeded").value = "1";
      document.getElementById("itemHave").value = "0";
      document.getElementById("itemNotes").value = "";
      document.getElementById("editingId").value = "";
    }

    function editItem(id) {
      const items = loadItems();
      const item = items.find(i => i.id === id);
      if (!item) return;

      document.getElementById("itemName").value = item.name;
      document.getElementById("itemCategory").value = item.category || "";
      document.getElementById("itemPriority").value = String(item.priority);
      document.getElementById("itemNeeded").value = String(item.needed);
      document.getElementById("itemHave").value = String(item.have);
      document.getElementById("itemNotes").value = item.notes || "";
      document.getElementById("editingId").value = item.id;
    }

    function deleteItem(id) {
      if (!confirm("Delete this item?")) return;
      let items = loadItems();
      items = items.filter(i => i.id !== id);
      saveItems(items);
      renderItems();
    }

    function adjustHave(id, delta) {
      let items = loadItems();
      items = items.map(i => {
        if (i.id === id) {
          const have = Math.max(i.have + delta, 0);
          return { ...i, have };
        }
        return i;
      });
      saveItems(items);
      renderItems();
    }

    function renderItems() {
      const container = document.getElementById("itemsContainer");
      const filterStatus = document.getElementById("filterStatus").value;
      const sortMode = document.getElementById("sortMode").value;

      let items = loadItems().map(i => ({
        ...i,
        remaining: Math.max(i.needed - i.have, 0),
        done: i.have >= i.needed
      }));

      if (filterStatus === "active") {
        items = items.filter(i => !i.done);
      } else if (filterStatus === "done") {
        items = items.filter(i => i.done);
      }

      if (sortMode === "priority") {
        items.sort((a, b) => {
          if (a.done !== b.done) return a.done - b.done;
          if (b.priority !== a.priority) return b.priority - a.priority;
          if (a.remaining !== b.remaining) return a.remaining - b.remaining;
          return a.name.localeCompare(b.name);
        });
      } else if (sortMode === "name") {
        items.sort((a, b) => a.name.localeCompare(b.name));
      }

      if (items.length === 0) {
        container.innerHTML =
          '<div class="empty-state">No items yet. Add something above to start tracking.</div>';
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Category</th>
              <th>Priority</th>
              <th>Have / Needed</th>
              <th>Remaining</th>
              <th>Status</th>
              <th>Notes</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
      `;

      for (const item of items) {
        const priorityClass =
          item.priority === 3
            ? "priority-high"
            : item.priority === 2
            ? "priority-medium"
            : "priority-low";

        const statusClass = item.done ? "status-done" : "status-active";
        const statusText = item.done ? "Done" : "Farming";

        html += `
          <tr class="${item.done ? "done" : ""}">
            <td>${item.name}</td>
            <td>${item.category || ""}</td>
            <td>
              <span class="priority-pill ${priorityClass}">
                ${getPriorityLabel(item.priority)}
              </span>
            </td>
            <td>${item.have} / ${item.needed}</td>
            <td>${item.remaining}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            <td>${item.notes ? item.notes.replace(/\n/g, "<br>") : ""}</td>
            <td>
              <button class="btn-small btn-secondary" onclick="editItem('${item.id}')">Edit</button>
              <button class="btn-small btn-secondary" onclick="adjustHave('${item.id}', 1)">+1</button>
              <button class="btn-small btn-secondary" onclick="adjustHave('${item.id}', -1)">-1</button>
              <button class="btn-small btn-secondary" onclick="deleteItem('${item.id}')">✕</button>
            </td>
          </tr>
        `;
      }

      html += "</tbody></table>";
      container.innerHTML = html;
    }

    // ============================
    // 6. INITIAL WIRING
    // ============================

    document.getElementById("addItemBtn").addEventListener("click", addOrUpdateItem);
    document.getElementById("clearFormBtn").addEventListener("click", clearForm);
    document.getElementById("filterStatus").addEventListener("change", renderItems);
    document.getElementById("sortMode").addEventListener("change", renderItems);

    (async function initApp() {
      initAuth();
      await handleEmailLinkSignIn();
      if (!auth) {
        // No Firebase → just render Guest items
        renderItems();
      }
      // If Firebase is configured, onAuthStateChanged will render after login state is resolved
    })();
  </script>
</body>
</html>
